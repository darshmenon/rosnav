ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    two_d_mode: true
    publish_tf: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    # Wheel odom: gz DiffDrive integrates from actual (torque/accel-limited)
    # joint velocities, not commanded ones, so it drifts like a real wheel
    # encoder over long runs — worth fusing with the IMU below rather than
    # trusting outright. frame_id/child_frame_id on this topic are already
    # odom/base_link; it no longer reaches TF directly (see gazebo_control*.xacro).
    odom0: odom
    odom0_config: [true,  true,  false,
                   false, false, true,
                   true,  false, false,
                   false, false, true,
                   false, false, false]
    odom0_differential: false
    odom0_relative: false
    odom0_queue_size: 10

    # IMU gyro (stddev 0.0002 rad/s) is far cleaner than integrated wheel
    # yaw, so it's the main heading-drift correction here.
    imu0: imu
    imu0_config: [false, false, false,
                  false, false, true,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_differential: false
    imu0_relative: false
    imu0_queue_size: 10
    imu0_remove_gravitational_acceleration: true
