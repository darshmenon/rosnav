/**:
  ros__parameters:
    frequency: 30.0
    two_d_mode: true
    publish_tf: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    # Wheel odom: gz DiffDrive integrates from actual (torque/accel-limited)
    # joint velocities, not commanded ones, so it drifts like a real wheel
    # encoder over long runs — worth fusing with the IMU below rather than
    # trusting outright. frame_id/child_frame_id on this topic are already
    # odom/base_link; it no longer reaches TF directly (see gazebo_control*.xacro).
    odom0: odom
    # yaw (row 2, index 5) intentionally false: post-2026-08-26 IMU-publish
    # fix, imu0 now reliably supplies clean absolute yaw below — fusing
    # wheel-integrated yaw here too was averaging it against the IMU's,
    # dragging in wheel-odom's larger heading drift. Wheel odom still
    # contributes only forward velocity (vx): fusing its x/y POSE (integrated with its own
    # under-counted heading, ~36 deg short per 360 deg spin) made position drift up to 3.4 m
    # in a spin+drive test while the EKF yaw itself was exact; vx integrated along the IMU yaw
    # fixes that. Its yaw-rate is off by the same ~10% scale, so the IMU gyro owns yaw-rate.
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  false, false,
                   false, false, false,
                   false, false, false]
    odom0_differential: false
    odom0_relative: false
    odom0_queue_size: 10

    # IMU gyro (stddev 0.0002 rad/s) is far cleaner than integrated wheel
    # yaw, so it's the main heading-drift correction here.
    imu0: imu
    imu0_config: [false, false, false,
                  false, false, true,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_differential: false
    imu0_relative: false
    imu0_queue_size: 10
    imu0_remove_gravitational_acceleration: true
