# gs_keepout_filter.yaml — Nav2 costmap filter pair that turns a GS-derived
# mask (see scripts/gs_mask_from_splat.py) into a KeepoutFilter layer.
# `yaml_filename` below is overridden at launch (slam_nav.launch.py
# gs_keepout_mask:=<path>) — the value here is just a placeholder.
filter_mask_server:
  ros__parameters:
    use_sim_time: true
    frame_id: "map"
    topic_name: "/gs/keepout_filter_mask"
    yaml_filename: ""

costmap_filter_info_server:
  ros__parameters:
    use_sim_time: true
    filter_info_topic: "/gs/costmap_filter_info"
    type: 0  # 0 = Keepout/Binary (nav2_costmap_2d::KeepoutFilter), 1 = Speed
    mask_topic: "/gs/keepout_filter_mask"
    base: 0.0
    multiplier: 1.0
