# Open-RMF fleet adapter settings for rosnav_bot.
#
# New users: edit this file (+ config/locations.yaml) instead of Python.
# Then: ros2 launch rosnav_bot rmf_fleet.launch.py
#
# Plug-ins
# ────────
# docking.plugin:
#   aruco  — run aruco_dock.py for camera final approach (default)
#   noop   — instantly confirm dock (useful for bring-up / no camera)
#   module.path:ClassName — custom DockingPlugin (see rosnav_bot.rmf.docking)

fleet_name: rosnav_fleet
map_name: hospital

# Named charger waypoint (must exist in locations.yaml)
charger: charging_dock

# Relative to this package's config/ directory, or an absolute path
locations_file: locations.yaml

# Bidirectional lanes on the RMF nav graph (star through hallway by default)
lanes:
  - [origin, hallway]
  - [hallway, room_a]
  - [hallway, room_b]
  - [hallway, room_c]
  - [hallway, charging_dock]

vehicle:
  radius: 0.22
  linear: [0.5, 2.5]    # [max_velocity, max_acceleration]
  angular: [2.5, 3.2]

docking:
  plugin: aruco
  # Extra ros-args forwarded to aruco_dock.py (ignored by noop).
  # docks_file:=docks.yaml and prefer_restage:=true are already hardcoded by
  # ArucoDockingPlugin — only list overrides/additions here (e.g. max_retries).
  # Per-dock marker/staging/charge settings live in config/docks.yaml
  args:
    - "-p"
    - "max_retries:=3"

nav:
  goal_timeout_sec: 5.0
  max_retries: 3
  pose_wait_sec: 5.0
  use_sim_time: true

battery:
  # Placeholders — no real battery telemetry in this sim yet
  voltage_capacity_charging: [24.0, 40.0, 8.8]
  mechanical: [70.0, 40.0]   # mass, inertia (radius taken from vehicle.radius)
  ambient_power_w: 20.0
  tool_power_w: 10.0
  recharge_threshold: 0.2
  recharge_soc: 1.0
  account_for_drain: false

# Which task categories this fleet will bid on / accept
tasks:
  accept_patrol: true
  accept_composed: true
  accept_delivery: true
