frontier_explorer:
  ros__parameters:
    map_topic: /map
    costmap_topic: /global_costmap/costmap
    local_costmap_topic: /local_costmap/costmap
    navigate_to_pose_action_name: navigate_to_pose
    global_frame: map
    robot_base_frame: base_link
    frontier_marker_topic: /explore/frontiers
    selected_frontier_topic: /explore/selected_frontier
    autostart: true
    use_sim_time: true
    mrtsp_solver: greedy
    return_to_start_on_complete: false
    map_processing_rate_hz: 1.0
    # Suppression is off by default upstream — confirmed live (2026-08-25/26,
    # warehouse.world) this makes MRTSP retry the same unreachable frontier
    # forever (repeated "Failed to make progress" on the identical goal, zero
    # position change). Enabling with upstream's own suggested defaults.
    frontier_suppression_enabled: true
    frontier_suppression_attempt_threshold: 3
    frontier_suppression_no_progress_timeout_s: 20.0
    frontier_suppression_timeout_s: 90.0
